Screens:
  upload_atc_request:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |+
        =
    Children:
      - atc_container:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            Height: =306
            Width: =759
            X: =302
            Y: =200
          Children:
            - btn_upload_atc:
                Control: CodeComponent
                ComponentName: citdevkk_cdFI.FluentFilesImportControl
                Properties:
                  ButtonSize: ='cdFI.FluentFilesImportControl.ButtonSize'.Large
                  DisabledFocusable: =If(varHasRealFile, true,false)
                  DisplayMode: ="10"
                  Height: =43
                  OnChange: |-
                    =// check file
                    Set(
                        hasNoATCFile,
                        IfError(
                            CountRows(Table(ParseJSON(btn_upload_atc.FilesAsJSON))) = 0,
                            true
                        )
                    );

                    Set(
                        hasInvalidATCFileName,
                        !hasNoATCFile &&
                        !IsEmpty(
                            Filter(
                                Table(ParseJSON(btn_upload_atc.FilesAsJSON)) As file,
                                !IsMatch(
                                    Lower(file.Value.name & ""),
                                    "^atc request_.+\.(doc|docx)$"
                                )
                            )
                        )
                    );

                    // upload
                    If(
                        hasNoATCFile || hasInvalidATCFileName,


                        Set(varHasRealFile, false);
                        Set(toast_3, GUID()),

                        ForAll(
                            Table(ParseJSON(btn_upload_atc.FilesAsJSON)) As file,
                            REJESTR_PRAWNY_ATC_UPLOAD.Run(
                                {
                                    name: file.Value.name & "",
                                    contentBytes: file.Value.contentBytes & ""
                                },
                                Text(gblNewRecord.ID)
                            )
                        );
                        Set(varHasRealFile, true);
                        Set(toast_2, GUID())
                    );
                  Text: =T("LBL_FILE_UPLOAD")
                  Width: =168
                  X: =475
                  Y: =167
            - btn_download_atc:
                Control: Button@0.0.45
                Properties:
                  FontSize: =16
                  Height: =47
                  Icon: =
                  Layout: ='ButtonCanvas.Layout'.TextOnly
                  OnSelect: =Launch("link_to_empty_atc_request_template.docx")
                  Text: =T("LBL_DOWNLOAD_EMPTY_ATC_REQUEST")
                  Width: =285
                  X: =48
                  Y: =144
            - atc_upload_label:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Center
                  Height: =59
                  Size: =18
                  Text: =T("LBL_UPLOAD_FILLED_ATC_REQUEST_FILE")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =326
                  X: =408
                  Y: =86
            - cotainer_label:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Center
                  Height: =38
                  Size: =25
                  Text: =T("LBL_ATC_REQUEST")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =759
                  Y: =26
            - vertical_divider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(214, 221, 224, 1)
                  Fill: =RGBA(214, 221, 224, 1)
                  Height: =182
                  Width: =2
                  X: =379
                  Y: =85
      - HotToast2:
          Control: CodeComponent
          ComponentName: BorowyJ_Contoso.HotToast
          Properties:
            durationMs: =8000
            message: =T("LBL_ATC_UPLOAD_SUCCESS_FLOW_STARTED_PREVIEW")
            triggerKey: =toast_2
            variant: ='Contoso.HotToast.variant'.success
      - Table2:
          Control: Table@1.0.278
          Properties:
            DisplayMode: =DisplayMode.View
            EnableRangeSelection: ="no"
            EnableSorting: ="no"
            FontColor: |-
              =With(
                  {
                      _expectedName: "ATC REQUEST_Vendor.docx",
                      _uploadedName: IfError(
                          First(Table(ParseJSON(btn_upload_atc.FilesAsJSON))).Value.name & "",
                          ""
                      )
                  },
                  If(
                      IsBlank(_uploadedName),
                      Color.Black,
                      If(
                          Lower(Trim(_uploadedName)) = Lower(Trim(_expectedName)),
                          Color.Green,
                          Color.Red
                      )
                  )
              )
            Height: =188
            Items: |-
              =With(
                  {
                      _uploadedName: IfError(
                          First(Table(ParseJSON(btn_upload_atc.FilesAsJSON))).Value.name & "",
                          ""
                      )
                  },
                  Table(
                      {
                          Label: T("LBL_EXPECTED_FILE"),
                          Value: "ATC REQUEST_Vendor.docx"
                      },
                      {
                          Label: T("LBL_UPLOADED_FILE"),
                          Value: If(IsBlank(_uploadedName), ".........", _uploadedName)
                      }
                  )
              )
            ReflowBehavior: ='PowerAppsOneGrid.ReflowBehavior'.ListOnly
            ShowAvatar: ="no"
            ShowColumnHeaders: ="no"
            ShowFooter: ="no"
            Width: =246
            X: =1087
            Y: =259
          Children:
            - Label1:
                Control: TableDataField@1.5.0
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Label"
                  FieldName: ="Label"
                  FieldType: ="s"
                  Order: =1
            - Value1:
                Control: TableDataField@1.5.0
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Value"
                  FieldName: ="Value"
                  FieldType: ="s"
                  Order: =2
      - HotToast3:
          Control: CodeComponent
          ComponentName: BorowyJ_Contoso.HotToast
          Properties:
            X: =20
            Y: =20
            message: =T("LBL_INVALID_FILE_NAME_OR_FORMAT")
            triggerKey: =toast_3
            variant: ='Contoso.HotToast.variant'.error
      - ButtonCanvas1:
          Control: Button@0.0.45
          Properties:
            Height: =48
            Text: ="Next"
            Visible: |-
              =With(
                  {
                      _expectedName: "ATC REQUEST_Vendor.docx",
                      _uploadedName: IfError(
                          First(Table(ParseJSON(btn_upload_atc.FilesAsJSON))).Value.name & "",
                          ""
                      )
                  },
                  !IsBlank(_uploadedName) &&
                  Lower(Trim(_uploadedName)) = Lower(Trim(_expectedName))
              )
            Width: =102
            X: =630
            Y: =617
